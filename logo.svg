<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130" width="460" height="130">
  <defs>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#00B344" />
    </linearGradient>
  </defs>

  <!-- Icon: hex frame containing isometric DB layers + eye/cursor -->
  <g transform="translate(15, 10)">
    <polygon points="55,4 100,29 100,79 55,104 10,79 10,29"
      fill="#0C0D0E" stroke="#666666" stroke-width="2" />

    <!-- top DB layer -->
    <path d="M 55 26 L 82 40 L 55 54 L 28 40 Z"
      fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5" />

    <!-- middle layer: the eye -->
    <path d="M 28 54 C 40 46 70 46 82 54 C 70 62 40 62 28 54 Z"
      fill="#0C0D0E" stroke="url(#green)" stroke-width="2.5" />
    <rect x="49" y="49" width="12" height="10" rx="1" fill="url(#green)" />

    <!-- bottom DB layer / foundation -->
    <path d="M 28 72 L 55 86 L 82 72"
      fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(140, 0)">
    <text x="0" y="70" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace"
      font-weight="700" font-size="46" fill="#0C0D0E">DB-Eye</text>
    <rect x="217" y="30" width="16" height="40" fill="url(#green)" />
    <text x="2" y="95" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace"
      font-size="12" letter-spacing="2" fill="#666666">TERMINAL DATABASE BROWSER</text>
  </g>
</svg>
