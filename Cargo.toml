[package]
name = "db-eye"
version = "0.4.0"
edition = "2024"
description = "Terminal UI database browser for SQLite, PostgreSQL, MySQL, and MS SQL Server"
license = "MIT"
repository = "https://github.com/arsyadal/db-eye"
homepage = "https://github.com/arsyadal/db-eye"
keywords = ["database", "tui", "sqlite", "postgresql", "mssql"]
categories = ["command-line-utilities", "database"]
readme = "README.md"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.0"
sqlx = { version = "0.8.6", features = ["sqlite", "postgres", "mysql", "runtime-tokio", "any"] }
tokio = { version = "1.52.1", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
self-replace = "1.5.0"
tiberius = { version = "0.13.0", default-features = false, features = ["rustls", "tds73", "tds80", "chrono", "sql-browser-tokio"] }
tokio-util = { version = "0.7", features = ["compat"] }
chrono = "0.4"
